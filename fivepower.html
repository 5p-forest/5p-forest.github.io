<h1>五力是什麼？</h1>

<div class="content">

每個人面對自己、他人與環境時，<br>
都有不同的因應方式。<br><br>

《五力》，<br>
是將這些常見的因應方式，<br>
轉譯成五種容易理解、可以培養的力量。<br><br>

它不是人格分類，<br>
也不是貼標籤。<br><br>

而是一組協助我們探索自己的工具。
