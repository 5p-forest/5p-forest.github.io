<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#fafaf8;
    color:#4f4f4f;

    font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

}

main{

    
    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:40px 20px 20px;

}

.container{

    width:100%;
    max-width:760px;

    text-align:center;

}

h1{

    color:#5f4732;

    font-size:42px;

    font-weight:700;

    margin-bottom:12px;

    white-space:nowrap;

}

.intro{

    font-size:20px;
    font-weight:400;
    line-height:1.9;

    margin-bottom:0px;

}

.card-list{

    display:flex;
    flex-direction:column;
    gap:15px;

    width:100%;

    margin-bottom:20px;

}

.card{

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    width:100%;
    min-height:110px;

    padding:18px 30px;

    border:1px solid rgba(124,146,99,.22);
    border-radius:28px;

    background:#fff;

    color:#4f4f4f;

    text-decoration:none;

    box-shadow:0 10px 28px rgba(95,71,50,.08);

    transition:transform .25s, box-shadow .25s, border-color .25s, background .25s;

}

.card:hover,
.card:focus-visible{

    transform:translateY(-4px);

    border-color:rgba(124,146,99,.46);

    background:#fffffd;

    box-shadow:0 16px 34px rgba(95,71,50,.13);

}

.card:focus-visible{

    outline:3px solid rgba(144,168,118,.35);
    outline-offset:4px;

}

.card-title{

    color:#5f4732;

    font-size:28px;
    font-weight:700;
    line-height:1.5;

    margin-bottom:10px;

}

.card-description{

    font-size:20px;
    font-weight:400;
    line-height:1.8;

}

footer{

    color:#666;

    font-size:16px;
    line-height:1.9;

    text-align:center;

    padding-bottom:28px;

}

.footer-links {

    color:#5f4732;

    font-weight:600;

}

.footer-gardener {

    font-size:13px;
    color:#777;

    margin-top:6px;

}

.footer-links a,
.footer-links a:visited{
    
    color:#5f4732;

    text-decoration:none;

}

.footer-links a:hover,
.footer-links a:focus-visible{

    text-decoration:underline;

}

/* ---------- 手機 ---------- */

@media (max-width:768px){

main{

    min-height:auto;

    align-items:flex-start;

    padding:16px 18px 18px;

}

h1{

    font-size:35px;

    margin-bottom:12px;

}

.intro{

    font-size:18px;
    font-weight:400;

    margin-bottom:0px;

}

.card-list{

    gap:12px;

    margin-bottom:15px;

}

.card{

    min-height:120px;

    padding:24px 22px;

    border-radius:24px;

}

.card-title{

    font-size:24px;

}

.card-description{

    font-size:18px;

}

footer{

    font-size:15px;

    padding:0 18px 20px;

}

}

</style>
