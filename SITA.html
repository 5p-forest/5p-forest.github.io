<h1>《事內對行》是什麼？</h1>

<div class="subtitle">看見心理歷程，重新擁有選擇。</div>

<div class="content">

每天，我們都會遇見各種事件。<br><br>

真正影響情緒、關係與行動的，<br>
往往不是事件本身，<br>
而是事件之後，<br>
心理歷程如何一步步走向行動。

</div>

<div class="content model-intro">

<strong>《事內對行》</strong><br>
是一套協助人們理解心理歷程的模型。<br><br>

透過四個步驟，<br>
幫助我們看見事件之後，<br>
心理歷程如何一步步走向行動。
    
</div>

<div class="process" aria-label="事內對行模型流程">

<span>事（事件）</span>

<span>內（內在）</span>
<span class="process-arrow">→</span>
<span>對（對話）</span>
<span class="process-arrow">→</span>
<span>行（行動）</span>

</div>

<div class="closing">
